<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>404 - Not Found</title>
    <link
      rel="stylesheet"
      href="/static/styles.css"
    />
    <style>
      body.error-page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .error-container {
        max-width: 500px;
      }
      .error-icon {
        font-size: 6rem;
        margin-bottom: 20px;
        line-height: 1;
        animation: bounce 1s infinite alternate;
      }
      .error-container h1 {
        color: #bd388d;
        margin-top: 0;
        margin-bottom: 15px;
        font-weight: 300;
        font-size: 2.5rem;
      }
      .error-container p {
        font-size: 1.1rem;
        color: #ccc;
        margin-bottom: 30px;
        line-height: 1.6;
      }
      .home-link {
        display: inline-block;
        padding: 12px 25px;
        background-color: #464646;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 1rem;
        transition: background-color 0.3s ease;
      }
      .home-link:hover {
        background-color: #5d4263;
      }
      @keyframes bounce {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-10px);
        }
      }
    </style>
  </head>
  <body class="error-page">
    <div class="error-container">
      <div class="error-icon">🤔</div>
      <h1>404 - Not Found</h1>
      <p>
        Oops! The map marker for this page seems to be missing.<br />
        Or maybe the page never existed?
      </p>
      <a
        href="/"
        class="home-link"
        >Back to the Overworld</a
      >
    </div>
  </body>
</html>
