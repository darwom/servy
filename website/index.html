<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      property="og:title"
      content="Zwaggerboyz Minecraft Maps"
    />
    <meta
      property="og:description"
      content="Uncover the lands we've shaped, the stories we've written. This is our Minecraft realm, mapped in detail."
    />
    <meta
      property="og:image"
      content="/static/preview.jpg"
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      property="og:url"
      content="https://zwaggerboyz.de/"
    />
    <meta
      property="og:type"
      content="website"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#bd388d"
    />
    <link
      rel="preload"
      href="/static/main.js"
      as="script"
    />
    <script
      src="/static/main.js"
      defer
    ></script>
    <link
      rel="preload"
      href="/static/styles.css"
      as="style"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/static/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="/static/styles.css"
    />
    <title>Zwaggerboyz Map</title>
  </head>
  <body>
    <header>
      <div>
        <button
          id="mobileHeaderToggle"
          class="mobile-logo-toggle"
        >
          <div class="logo"></div>
        </button>
        <div class="logo desktop-logo"></div>
        <button
          class="map-button active"
          data-map="world"
        >
          World
        </button>
        <button
          class="map-button"
          data-map="nether"
        >
          Nether
        </button>
        <button
          class="map-button"
          data-map="end"
        >
          End
        </button>
      </div>
      <div id="headerSecondary">
        <span id="playerCount">Loading...</span>
        <span id="timestamp">Map updated: Loading...</span>
        <button id="reloadButton">Update Map</button>
        <button id="marker">Marker</button>
      </div>
    </header>
    <div id="markerForm">
      <h3>Add a Text Marker</h3>
      <div class="markerInputs">
        <input
          type="number"
          id="markerX"
          placeholder="X coordinate"
          required
        />
        <input
          type="number"
          id="markerZ"
          placeholder="Z coordinate"
          required
        />
        <input
          type="text"
          id="markerText"
          placeholder="Marker Text"
          maxlength="32"
          required
        />
        <button id="addMarkerButton">Add Marker</button>
      </div>
      <span>Press CTRL+C over map for coordinates. Removing markers requires manual action!</span>
    </div>
    <div id="mapContainer">
      <iframe
        title="Minecraft Server Map"
        id="mapFrame"
        src="/maps/world/index.html"
        width="100%"
        height="100%"
        frameborder="0"
      ></iframe>
    </div>
  </body>
</html>
